<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Loucura Animal 2</title>
    <!-- PWA: dá pra instalar o jogo como app -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Loucura Animal 2" />
    <style>
      html, body { margin: 0; height: 100%; background: #0f1115; font-family: system-ui, sans-serif; color: #e6e6e6; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      /* No celular o jogo ocupa a tela inteira */
      #game { width: 100vw; height: 100dvh; touch-action: none; }
      #game canvas { touch-action: none; }
      /* No desktop mantém a proporção 4:3, centralizado e nítido */
      @media (min-width: 700px) and (min-height: 520px) {
        #game { width: 800px; height: 600px; box-shadow: 0 10px 40px rgba(0,0,0,.5); border-radius: 8px; overflow: hidden; }
      }
      #installBtn {
        display: none; position: fixed; right: 10px; bottom: 10px; z-index: 9999;
        background: #0d9488; color: #fff; border: 2px solid #fde047; border-radius: 10px;
        font: bold 14px system-ui, sans-serif; padding: 8px 12px; cursor: pointer;
        box-shadow: 0 4px 14px rgba(0,0,0,.4);
      }
      #installBtn:active { transform: translateY(1px); }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <button id="installBtn" aria-label="Instalar o jogo">📲 Instalar</button>
    <script type="module" src="/src/main.js"></script>
    <script>
      // registra o service worker (necessário pro app ser instalável e funcionar offline)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
      // botão "Instalar": aparece quando o navegador permite instalar o app
      let deferredPrompt = null;
      const installBtn = document.getElementById('installBtn');
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
      });
      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        installBtn.style.display = 'none';
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      });
      window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; });
    </script>
  
  <!-- Convite de instalar: aparece quando o jogo é aberto pelo botão "📲 Instalar app"
       do site (cacaivilela.github.io), que abre o endereço com ?instalar=1 -->
  <script>
  (function () {
    if (!/[?&]instalar=1/.test(location.search)) return;

    var NOME = 'o Loucura Animal 2';
    var caixa = null;
    var promptEvt = null;
    var instalado = window.matchMedia('(display-mode: standalone)').matches
      || window.matchMedia('(display-mode: fullscreen)').matches
      || window.navigator.standalone === true;

    function limparEndereco() {
      try {
        var u = new URL(location.href);
        u.searchParams.delete('instalar');
        history.replaceState(null, '', u.pathname + u.search + u.hash);
      } catch (e) {}
    }

    function fechar() {
      if (caixa) { caixa.remove(); caixa = null; }
      limparEndereco();
    }

    function mostrar(texto) {
      if (caixa) return atualizar(texto);
      caixa = document.createElement('div');
      caixa.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;'
        + 'align-items:center;justify-content:center;padding:20px;'
        + 'background:rgba(6,4,18,.72);backdrop-filter:blur(3px);'
        + 'font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif';
      caixa.innerHTML = '<div style="max-width:420px;width:100%;background:#151228;color:#fff;'
        + 'border:2px solid rgba(255,255,255,.14);border-radius:18px;padding:24px;text-align:center;'
        + 'box-shadow:0 20px 60px rgba(0,0,0,.5)">'
        + '<div style="font-size:44px;line-height:1">📲</div>'
        + '<h2 style="margin:10px 0 6px;font-size:22px">Instalar ' + NOME + '?</h2>'
        + '<p id="crc-inst-msg" style="margin:0 0 18px;color:#c9c4e8;font-size:15px">'
        + 'Fica com ícone na sua tela, abre em janela própria e dá pra jogar até sem internet.</p>'
        + '<button id="crc-inst-sim" style="width:100%;cursor:pointer;font:inherit;font-weight:700;'
        + 'font-size:17px;padding:14px;border:0;border-radius:12px;background:#16a34a;color:#fff">'
        + '📲 INSTALAR</button>'
        + '<button id="crc-inst-nao" style="width:100%;margin-top:10px;cursor:pointer;font:inherit;'
        + 'padding:10px;border:0;border-radius:12px;background:transparent;color:#a5a0c8">'
        + 'agora não, quero jogar</button>'
        + '</div>';
      document.body.appendChild(caixa);
      caixa.querySelector('#crc-inst-nao').addEventListener('click', fechar);
      caixa.addEventListener('click', function (e) { if (e.target === caixa) fechar(); });
      caixa.querySelector('#crc-inst-sim').addEventListener('click', async function () {
        if (promptEvt) {
          promptEvt.prompt();
          var escolha = null;
          try { escolha = await promptEvt.userChoice; } catch (e) {}
          promptEvt = null;
          if (!escolha || escolha.outcome !== 'accepted') return fechar();
          return;
        }
        atualizar(comoInstalarNaMao());
      });
      if (texto) atualizar(texto);
    }

    function atualizar(texto) {
      if (!caixa || !texto) return;
      var msg = caixa.querySelector('#crc-inst-msg');
      if (msg) msg.textContent = texto;
    }

    function comoInstalarNaMao() {
      var ua = navigator.userAgent || '';
      if (/iPhone|iPad|iPod/.test(ua)) {
        return 'No iPhone/iPad: toque em Compartilhar ⬆️ na barra do Safari e depois em "Adicionar à Tela de Início".';
      }
      if (/Android/.test(ua)) {
        return 'No Android: abra o menu ⋮ do navegador e toque em "Instalar aplicativo" (ou "Adicionar à tela inicial").';
      }
      return 'No computador: clique no ícone de instalar na barra de endereço (ou menu ⋮ → "Instalar"). O Firefox não instala aplicativos web — use o Chrome ou o Edge.';
    }

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      promptEvt = e;
      mostrar();
    });

    window.addEventListener('appinstalled', function () {
      promptEvt = null;
      atualizar('Pronto! ' + NOME + ' foi instalado 🎉 Procure o ícone na sua tela.');
      setTimeout(fechar, 2500);
    });

    function comecar() {
      if (instalado) {
        mostrar('Boa notícia: ' + NOME + ' já está instalado 🎉 Abra pelo ícone na sua tela.');
        return;
      }
      // Se em 2,5s o navegador não ofereceu instalação, explicamos como fazer na mão.
      setTimeout(function () { if (!promptEvt) mostrar(comoInstalarNaMao()); }, 2500);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', comecar);
    } else {
      comecar();
    }
  })();
  </script>
</body>
</html>
